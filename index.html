<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maps — Alex Priest</title>
<style>
  :root{ --paper:#F0E9E4; --ink:#241619; --soft:#7A6A66; --rule:#DDD1C9; --accent:#8C2F39 }
  @media (prefers-color-scheme:dark){
    :root{ --paper:#191013; --ink:#EFE4E0; --soft:#A08D89; --rule:#3A2A2E; --accent:#D4636C } }
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
    font:17px/1.6 "Iowan Old Style",Charter,Palatino,Georgia,serif;padding:32px}
  main{max-width:44ch}
  h1{margin:0 0 6px;font:400 34px/1.1 "Hoefler Text",Palatino,Georgia,serif;letter-spacing:-.02em}
  p{color:var(--soft);margin:0 0 30px}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  li{border-bottom:1px solid var(--rule)}
  a{display:flex;gap:14px;align-items:baseline;padding:16px 2px;color:var(--ink);text-decoration:none}
  a:hover .t,a:focus-visible .t{color:var(--accent)}
  .t{font-size:19px}
  .m{margin-left:auto;font:500 10.5px/1 ui-sans-serif,-apple-system,sans-serif;text-transform:uppercase;
    letter-spacing:.11em;color:var(--soft);white-space:nowrap}
</style>
<main>
  <h1>Maps</h1>
  <p>Places worth going, from someone who went.</p>
  <ul>
    <li><a href="/cdmx/"><span class="t">Mexico City</span><span class="m">2019 &amp; 2023</span></a></li>
  </ul>
</main>
